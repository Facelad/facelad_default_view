name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` es intencional: cancelar un despliegue de Pages
# en vuelo puede dejarlo atascado. Coincide con la plantilla oficial de GitHub.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          # Astro 4.16 declara engines ^18.17.1 || ^20.3.0 || >=21.0.0.
          # Se fija en la LTS par para evitar EBADENGINE en majors impares.
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # upload-pages-artifact sirve el artefacto sin pasar por Jekyll, que de
      # otro modo ignoraría el directorio dist/_astro por empezar con guion bajo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
